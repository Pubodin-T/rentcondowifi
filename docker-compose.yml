version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rentwifi-postgres
    restart: always
    environment:
      POSTGRES_USER: rentwifi
      POSTGRES_PASSWORD: rentwifipassword
      POSTGRES_DB: rentwifi_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rentwifi-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:latest
    container_name: rentwifi-adminer
    restart: always
    ports:
      - '8080:8080'

volumes:
  postgres_data:
  redis_data:
