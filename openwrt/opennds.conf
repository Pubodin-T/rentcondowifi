# OpenNDS Configuration File for OpenWrt Router (Xiaomi AX3600 / Any OpenWrt)
# Location on Router: /etc/opennds/opennds.conf

# Gateway Interface (br-lan or Guest WiFi interface)
gatewayinterface br-lan

# Gateway Port (Default 2050)
gatewayport 2050

# Client Session Timeout (Minutes) - 0 = Continuous until package expires in Database / De-authenticated
sessiontimeout 0
checkinterval 60

# Gateway Name
gatewayname RentWiFi Captive Portal

# Forward Authentication Service (FAS) Setup
# Remote Server domain for RentWiFi Vercel App
fasremoteip 0.0.0.0
fasport 443
fasssl 1
faspath /portal
fasremotefqdn rentcondowifi.vercel.app

# Pre-authenticated Walled Garden (Allow HTTPS to Vercel portal and PromptPay domain)
unauthenticated_users {
    allow tcp port 80 to 0.0.0.0/0
    allow tcp port 443 to 0.0.0.0/0
}
