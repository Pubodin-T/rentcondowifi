# OpenNDS Configuration File for OpenWrt Router
# Location on Router: /etc/opennds/opennds.conf

gatewayinterface br-lan
gatewayport 2050

sessiontimeout 0
checkinterval 60

gatewayname RentWiFi Captive Portal

# FAS Remote Server Configuration
fassecurelevel 1
fasremotefqdn rentcondowifi.vercel.app
fasport 443
fasssl 1
faspath /portal

# Shared secret key for FAS
faskey 12345678901234567890123456789012

# Pre-authenticated Walled Garden rules
preauthenticated_users {
    allow tcp port 443 to 0.0.0.0/0
}
